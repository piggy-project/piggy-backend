name: CD Pipeline

on:
  push:
    branches: [ "main" ]  # main 브랜치만 감지

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission For Gradlew & Build gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Docker hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker Image Tag
        id: set_tag
        run: echo "tag=main" >> $GITHUB_OUTPUT

      - name: Docker image build & push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/som:${{ steps.set_tag.outputs.tag }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/som:${{ steps.set_tag.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/som

            sudo docker compose down
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f