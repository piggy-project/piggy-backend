spring:
  application:
    name: som-backend

  jackson:
    time-zone: Asia/Seoul

  mvc:
    problemdetails:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/som?serverTimezone=Asia/Seoul}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:REMOVED}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_EMAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://piggys.mooo.com/login/oauth2/code/google"
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "https://piggys.mooo.com/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "https://piggys.mooo.com/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
#  google:
#    vision:
#      api-key: ${GOOGLE_VISION_API_KEY}
#      url: https://vision.googleapis.com/v1/images:annotate

naver:
  api:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    url: https://openapi.naver.com/v1/search/shop.json
rakuten:
  api:
    application-id: ${RAKUTEN_APP_ID}
    access-key: ${RAKUTEN_ACCESS_KEY}
    url: https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20220601
  data:
    redis:
      host: redis
      port: 6379
      password: REMOVED
      lettuce:
        pool:
          max-active: 8 # 커넥션 풀 설정 (필요 시)
          max-idle: 8

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-expiration: 900000        # 15분
  refresh-expiration: 1209600000   # 14일

crypto:
  secret: ${CRYPTO_KEY}

exim-api:
  url: https://www.koreaexim.go.kr/site/program/financial/exchangeJSON
  auth-key: ${KOREAEXIM_API_KEY}

api:
  exchangerate:
    key: ${EXCHANGERATE_API_KEY}
    url: https://v6.exchangerate-api.com/v6/

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  frontend-url: https://piggys.mooo.com